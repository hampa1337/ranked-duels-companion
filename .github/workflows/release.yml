# Builds the app on GitHub (never on a private PC) when a version tag like
# v1.1.1 is pushed, signs a build attestation for the .exe and publishes it
# as a GitHub release with its SHA-256 checksum.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  id-token: write     # build attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content RankedDuelsCompanion.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match <Version>$version</Version>" }

      - name: Build
        run: dotnet build -c Release -nologo

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash bin/Release/net48/RankedDuelsCompanion.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RankedDuelsCompanion.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Build attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/Release/net48/RankedDuelsCompanion.exe

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-Content SHA256SUMS.txt).Split(" ")[0]
          $notes = "Built by GitHub Actions from commit ${{ github.sha }}.`n`nSHA-256: ``$hash```n`nVerify: ``gh attestation verify RankedDuelsCompanion.exe --repo ${{ github.repository }}``"
          gh release create "${{ github.ref_name }}" bin/Release/net48/RankedDuelsCompanion.exe SHA256SUMS.txt --title "Ranked Duels Companion ${{ github.ref_name }}" --notes $notes
